name: Sync Viator Tags

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if recently synced"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  # Run weekly on Monday at 2 AM UTC (2 PM NZDT / 3 PM NZST)
  schedule:
    - cron: "0 2 * * 1"  # Every Monday at 2 AM UTC

permissions:
  contents: read

concurrency:
  group: sync-viator-tags
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Calls the deployed Next.js route; Supabase/Viator env must exist on Vercel (not GitHub).
      - name: Sync Viator Tags
        env:
          # Vercel → Project → Settings → Deployment Protection → Protection Bypass for Automation
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Must match Vercel env `VIATOR_TAGS_SYNC_SECRET` (application auth for /api/viator/tags/sync)
          VIATOR_TAGS_SYNC_SECRET: ${{ secrets.VIATOR_TAGS_SYNC_SECRET }}
          # Optional: override base URL (default https://travelscout.co.nz — Production in your setup)
          SYNC_VIATOR_TAGS_BASE_URL: ${{ vars.SYNC_VIATOR_TAGS_BASE_URL }}
          FORCE_SYNC: ${{ github.event.inputs.force == 'true' }}
        run: |
          # On Vercel Production (your custom domain), set:
          #   VIATOR_API_KEY, NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, VIATOR_TAGS_SYNC_SECRET
          # GitHub secrets are not sent with this curl — only Vercel env is visible to the route.
          # Default is Production domain; travelscout.vercel.app may point at Preview/Dev in your project.
          # Override: set GitHub variable or secret SYNC_VIATOR_TAGS_BASE_URL (e.g. https://travelscout.co.nz)
          API_URL="${SYNC_VIATOR_TAGS_BASE_URL:-${VERCEL_URL:-https://travelscout.co.nz}}"
          
          # If VERCEL_URL is set but doesn't start with http, prepend https://
          if [[ ! "$API_URL" =~ ^https?:// ]]; then
            API_URL="https://${API_URL}"
          fi
          
          FORCE_FLAG=""
          if [ "$FORCE_SYNC" == "true" ]; then
            FORCE_FLAG="?force=true"
          fi
          
          echo "Syncing Viator tags from: ${API_URL}/api/viator/tags/sync${FORCE_FLAG}"
          
          # Vercel Deployment Protection (Vercel Authentication) blocks bare curl unless bypassed.
          # Set GitHub secret VERCEL_AUTOMATION_BYPASS_SECRET to your project's automation bypass token.
          CURL_ARGS=(-s -w "\n%{http_code}" -H "Content-Type: application/json")
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            CURL_ARGS+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          if [ -n "$VIATOR_TAGS_SYNC_SECRET" ]; then
            CURL_ARGS+=(-H "Authorization: Bearer ${VIATOR_TAGS_SYNC_SECRET}")
          fi
          
          # Try to call the API endpoint (requires deployment)
          # If the app is not deployed, this will fail gracefully
          response=$(curl "${CURL_ARGS[@]}" \
            "${API_URL}/api/viator/tags/sync${FORCE_FLAG}" || echo -e "\n000")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response HTTP Code: $http_code"
          echo "Response Body:"
          if command -v jq &> /dev/null; then
            echo "$body" | jq '.' 2>/dev/null || echo "$body"
          else
            echo "$body"
          fi
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Tag sync completed successfully"
            exit 0
          elif [ "$http_code" == "000" ]; then
            echo "⚠️  Could not reach API endpoint. This is expected if the app is not deployed."
            echo "⚠️  To sync tags, either:"
            echo "   1. Deploy the app and ensure the endpoint is accessible"
            echo "   2. Run the sync script locally: npm run sync:viator-tags"
            exit 0  # Don't fail the workflow if API is not available
          elif [ "$http_code" == "401" ]; then
            echo "❌ HTTP 401: Check the following:"
            echo "   - Repository secret VIATOR_TAGS_SYNC_SECRET must match Vercel env VIATOR_TAGS_SYNC_SECRET (required for /api/viator/tags/sync)."
            echo "   - If Vercel Deployment Protection is on, set VERCEL_AUTOMATION_BYPASS_SECRET (Vercel → Deployment Protection → Protection Bypass for Automation)."
            exit 1
          else
            echo "❌ Tag sync failed with HTTP $http_code"
            exit 1
          fi
