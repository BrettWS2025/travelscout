name: Deploy Supabase Migrations - Dev

# Re-run to refresh Dev advisor report after marketplace API work.
on:
  push:
    branches:
      - Dev
      - dev
      - develop
      - 'feature/**'
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations-dev.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Preview

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify secrets are set
        run: |
          echo "Checking required secrets..."
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "❌ ERROR: SUPABASE_ACCESS_TOKEN is not set"
            echo "Please set this secret in: Settings → Environments → Preview → Secrets"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_DEV_PROJECT_ID }}" ]; then
            echo "❌ ERROR: SUPABASE_DEV_PROJECT_ID is not set"
            echo "Please set this secret in: Settings → Environments → Preview → Secrets"
            echo "Or use repository-level secrets at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_DEV_DB_PASSWORD }}" ]; then
            echo "❌ ERROR: SUPABASE_DEV_DB_PASSWORD is not set"
            echo "Please set this secret in: Settings → Environments → Preview → Secrets"
            echo "Or use repository-level secrets at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✓ All required secrets are set"

      - name: Deploy migrations to Dev
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_DEV_PROJECT_ID }}
        run: |
          echo "Linking to Supabase project $SUPABASE_PROJECT_ID..."
          supabase link --project-ref $SUPABASE_PROJECT_ID --password $SUPABASE_DB_PASSWORD
          
          echo "Checking migration status..."
          supabase migration list || true
          
          echo "Repairing migration history for deleted migrations..."
          # Mark the deleted migrations (18, 19, 20, 21) as reverted in the migration history
          # This allows us to remove them from history since we consolidated them into migration 17 and replaced 21 with 22
          supabase migration repair --status reverted 20240101000018 20240101000019 20240101000020 20240101000021 2>&1 || echo "Note: Repair command completed (some migrations may not exist in history)"
          
          echo "Pushing database migrations..."
          supabase db push --include-all || supabase db push

      - name: Report Dev database advisors
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_DEV_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "=== Security advisors ==="
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/advisors/security?lint=true" \
            | tee /tmp/security-advisors.json
          echo
          echo "=== Performance advisors ==="
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/advisors/performance?lint=true" \
            | tee /tmp/performance-advisors.json
          echo
          python3 - <<'PY'
          import json
          for label, path in [("security","/tmp/security-advisors.json"),("performance","/tmp/performance-advisors.json")]:
              data=json.load(open(path))
              lints = data.get("lints") if isinstance(data, dict) else data
              if not isinstance(lints, list):
                  print(f"{label}: unexpected payload")
                  print(json.dumps(data, indent=2)[:5000])
                  continue
              print(f"\n{label}: {len(lints)} lint(s)")
              for lint in lints:
                  level = lint.get("level") or lint.get("severity") or "?"
                  name = lint.get("name") or lint.get("title") or "unknown"
                  detail = lint.get("detail") or lint.get("description") or ""
                  meta = lint.get("metadata") or {}
                  print(f"- [{level}] {name}")
                  if detail:
                      print(f"  {detail[:800]}")
                  if meta:
                      print(f"  metadata={json.dumps(meta)[:500]}")
          PY

