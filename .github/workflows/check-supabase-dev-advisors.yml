name: Check Supabase Dev Advisors

on:
  workflow_dispatch:

jobs:
  advisors:
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - name: Fetch Dev database advisors and marketplace status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_DEV_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_DEV_PROJECT_ID"
            exit 1
          fi

          echo "=== Security advisors ==="
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/advisors/security?lint=true" \
            | tee /tmp/security-advisors.json
          echo

          echo "=== Performance advisors ==="
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/advisors/performance?lint=true" \
            | tee /tmp/performance-advisors.json
          echo

          echo "=== Summarize ERROR/WARN findings ==="
          python3 - <<'PY'
          import json,sys
          for label, path in [("security","/tmp/security-advisors.json"),("performance","/tmp/performance-advisors.json")]:
            try:
              data=json.load(open(path))
            except Exception as e:
              print(f"{label}: failed to parse ({e})")
              continue
            lints = data.get("lints") if isinstance(data, dict) else data
            if not isinstance(lints, list):
              print(f"{label}: unexpected payload keys={list(data) if isinstance(data,dict) else type(data)}")
              print(json.dumps(data, indent=2)[:4000])
              continue
            print(f"\n{label}: {len(lints)} lint(s)")
            for lint in lints:
              level = lint.get("level") or lint.get("severity") or "?"
              name = lint.get("name") or lint.get("title") or lint.get("cache_key") or "unknown"
              detail = lint.get("detail") or lint.get("description") or lint.get("remediation") or ""
              meta = lint.get("metadata") or {}
              print(f"- [{level}] {name}")
              if detail:
                print(f"  {detail[:500]}")
              if meta:
                print(f"  metadata={json.dumps(meta)[:400]}")
          PY

          # Optional: schema smoke check via db password if CLI available
          npx --yes supabase@latest --version || true
          if command -v supabase >/dev/null 2>&1 || [ -x "$(npm root -g 2>/dev/null)/../bin/supabase" ]; then
            echo "CLI present"
          fi
